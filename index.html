<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Swing Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .switcher-bar {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    height: 48px;
  }
  .switcher-bar button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.35rem 1.2rem;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    background: transparent;
    color: rgba(255,255,255,0.55);
  }
  .switcher-bar button:hover {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.85);
  }
  .switcher-bar button.active {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border-color: rgba(255,255,255,0.5);
  }
  iframe {
    width: 100%;
    height: calc(100vh - 48px);
    border: none;
    display: block;
  }
</style>
</head>
<body>
  <div class="switcher-bar">
    <button id="btn-fed" class="active" data-src="fed.html">2028 Federal</button>
    <button id="btn-vic" data-src="vic.html">2026 Victoria</button>
  </div>
  <iframe id="sim-frame" src="fed.html"></iframe>
  <script>
    const buttons = document.querySelectorAll('.switcher-bar button');
    const frame = document.getElementById('sim-frame');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) return;
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frame.src = btn.dataset.src;
      });
    });
  </script>
</body>
</html>
